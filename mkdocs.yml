site_name: Joan Colon
site_description: Geospatial Data Engineer — 3D digital twins, cadastral systems, spatial ETL
site_url: https://jcmanuco6.github.io/
site_author: Joan Colon

theme:
  name: material
  font:
    text: Inter
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/extra.css
  - stylesheets/workflow-stepper.css
  - stylesheets/project-page.css

extra_javascript:
  - javascripts/workflow-stepper.js

nav:
  - Home: index.md
  - Projects:
      - 3D Cadastral Digital Twin & Cloud Pipeline: projects/cadastral-3d-pipeline.md
      - Cadastral Mapping Automation Guide (POC): projects/cadastral-mapbook-automation.md
      - Deep Learning Parcel Land-Use Classification: projects/deep-learning-land-use-classification.md
      - Interactive Analytics Map: projects/analytics-map.md
      - System Architecture: projects/system-architecture.md
      - Reality Capture Workflow: projects/reality-capture.md
  - Demos:
      - CesiumJS Bootcamp Viewer: demos/cesium-session1/index.html
  - Resume: cv/Joan_Colon_Resume_26-08-29.pdf

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

not_in_nav: |
  ideas-inspiration/
  screenshots/
